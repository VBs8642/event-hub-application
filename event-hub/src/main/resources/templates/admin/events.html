<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('All Events - Admin')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold"><i class="fa-solid fa-shield-halved text-danger me-2"></i>Admin — All Events</h1>
            <p class="text-muted">View and manage every event on the platform.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/users" class="btn btn-outline-secondary btn-sm">Users</a>
            <a href="/users/registrations" class="btn btn-outline-secondary btn-sm">Registrations</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Title</th>
                            <th>Creator</th>
                            <th>Location</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td class="fw-semibold" th:text="${event.title}">Title</td>
                            <td class="text-muted small"
                                th:text="${event.creator.firstName} + ' ' + ${event.creator.lastName}">Creator</td>
                            <td class="text-muted small"
                                th:text="${event.venue} + ', ' + ${event.city}">Location</td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(event.startDateTime, 'dd MMM yyyy, HH:mm')}">Date</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${event.status}">DRAFT</span>
                            </td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/events/{id}(id=${event.id})}"
                                       class="btn btn-sm btn-outline-dark">View</a>
                                    <a th:href="@{/events/edit/{id}(id=${event.id})}"
                                       class="btn btn-sm btn-outline-primary">Edit</a>
                                    <form th:action="@{/users/events/delete/{id}(id=${event.id})}" method="post"
                                          onsubmit="return confirm('Delete this event?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="6" class="text-center text-muted py-4">No events found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
