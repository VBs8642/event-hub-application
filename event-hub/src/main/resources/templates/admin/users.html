<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('User Management - EventHub')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold"><i class="fa-solid fa-shield-halved text-danger me-2"></i>Admin — User Management</h1>
            <p class="text-muted">Manage all registered users, their roles, and account status.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/users/events" class="btn btn-outline-secondary btn-sm">All Events</a>
            <a href="/users/registrations" class="btn btn-outline-secondary btn-sm">All Registrations</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="fw-semibold" th:text="${user.username}">username</td>
                            <td th:text="${user.firstName} + ' ' + ${user.lastName}">Full Name</td>
                            <td class="text-muted small" th:text="${user.email}">email</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : (${user.role.name() == 'ORGANIZER'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                      th:text="${user.role}">ROLE</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${user.active} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2 flex-wrap">
                                    <!-- Change Role -->
                                    <form th:action="@{/users/{id}/role(id=${user.id})}" method="post" class="d-flex gap-1">
                                        <select name="role" class="form-select form-select-sm" style="width:auto">
                                            <option th:each="r : ${roles}"
                                                    th:value="${r}"
                                                    th:text="${r}"
                                                    th:selected="${r == user.role}">ROLE</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-outline-primary">
                                            <i class="fa-solid fa-check"></i>
                                        </button>
                                    </form>
                                    <!-- Toggle Status -->
                                    <form th:action="@{/users/{id}/toggle-status(id=${user.id})}" method="post">
                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${user.active} ? 'Deactivate' : 'Activate'">Toggle</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center text-muted py-4">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
