<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Event Catalog - EventHub')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="mb-4">
        <h1 class="fw-bold">Explore Events</h1>
        <p class="text-muted">Discover upcoming events and register for the ones you like.</p>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="alert alert-light text-center py-5 border">
        <h4 class="text-secondary">No upcoming events available.</h4>
        <p class="text-muted mb-3">Check back later or create your own event.</p>
        <a th:href="@{/events/create}" class="btn btn-success px-4"
           sec:authorize="hasAnyRole('ADMIN', 'ORGANIZER')">Create Event</a>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(events)}">
        <div class="col-md-6 col-lg-4 mb-4" th:each="event : ${events}">
            <div class="card shadow-sm border-0 h-100">
                <img th:src="${#strings.isEmpty(event.imageUrl) ? 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?q=80&w=600' : event.imageUrl}"
                     class="card-img-top object-fit-cover" style="height: 200px;" alt="Event Banner">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold" th:text="${event.title}">Event Title</h5>
                    <p class="text-muted small mb-1">
                        <i class="fa-solid fa-location-dot me-1"></i>
                        <span th:text="${event.venue} + ', ' + ${event.city}">Location</span>
                    </p>
                    <p class="text-muted small mb-2">
                        <i class="fa-solid fa-calendar-days me-1"></i>
                        <span th:text="${#temporals.format(event.startDateTime, 'dd MMM yyyy, HH:mm')}">Date</span>
                    </p>
                    <p class="text-muted small mb-3" th:text="${#strings.abbreviate(event.description, 100)}">Description</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(event.ticketPrice, 1, 2)}">$0.00</span>
                        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-dark btn-sm">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
