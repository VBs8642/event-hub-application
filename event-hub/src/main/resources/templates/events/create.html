<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Event - EventHub')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="fw-bold text-dark mb-2">Create New Event</h2>
                    <p class="text-muted small mb-4">Fill in the details to publish your event.</p>

                    <form th:action="@{/events/create}" th:object="${eventDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Event Title</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Tech Conference 2026">
                            <div class="validation-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">City</label>
                                <input type="text" th:field="*{city}" class="form-control" placeholder="e.g. New York">
                                <div class="validation-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Venue</label>
                                <input type="text" th:field="*{venue}" class="form-control" placeholder="e.g. Convention Center">
                                <div class="validation-error" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}">Error</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Describe your event..."></textarea>
                            <div class="validation-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Image URL (optional)</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/image.jpg">
                            <div class="validation-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}">Error</div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Start Date & Time</label>
                                <input type="datetime-local" th:field="*{startDateTime}" class="form-control">
                                <div class="validation-error" th:if="${#fields.hasErrors('startDateTime')}" th:errors="*{startDateTime}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">End Date & Time</label>
                                <input type="datetime-local" th:field="*{endDateTime}" class="form-control">
                                <div class="validation-error" th:if="${#fields.hasErrors('endDateTime')}" th:errors="*{endDateTime}">Error</div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Capacity</label>
                                <input type="number" th:field="*{capacity}" class="form-control" min="1">
                                <div class="validation-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Ticket Price ($)</label>
                                <input type="number" th:field="*{ticketPrice}" class="form-control" min="0" step="0.01">
                                <div class="validation-error" th:if="${#fields.hasErrors('ticketPrice')}" th:errors="*{ticketPrice}">Error</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">Create Event</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
