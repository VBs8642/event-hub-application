<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Dashboard - EventHub')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold">My Events Dashboard</h1>
            <p class="text-muted">Manage the events you've created.</p>
        </div>
        <a th:href="@{/events/create}" class="btn btn-success px-4 py-2 fw-semibold shadow-sm">
            <i class="fa-solid fa-plus me-2"></i>Create Event
        </a>
    </div>

    <div th:if="${#lists.isEmpty(userEvents)}" class="alert alert-light text-center py-5 border">
        <h4 class="text-secondary">You haven't created any events yet.</h4>
        <p class="text-muted mb-3">Start organizing your first event and invite attendees.</p>
        <a th:href="@{/events/create}" class="btn btn-success px-4">Create Your First Event</a>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(userEvents)}">
        <div class="col-md-6 col-lg-4 mb-4" th:each="event : ${userEvents}">
            <div class="card shadow-sm border-0 h-100">
                <img th:src="${#strings.isEmpty(event.imageUrl) ? 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?q=80&w=600' : event.imageUrl}"
                     class="card-img-top object-fit-cover" style="height: 180px;" alt="Event Banner">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title fw-bold mb-0" th:text="${event.title}">Event Title</h5>
                        <span class="badge bg-success-subtle text-success border border-success"
                              th:text="${event.status}">DRAFT</span>
                    </div>
                    <p class="text-muted small mb-2">
                        <i class="fa-solid fa-location-dot me-1"></i>
                        <span th:text="${event.venue} + ', ' + ${event.city}">Location</span>
                    </p>
                    <p class="text-muted small mb-3">
                        <i class="fa-solid fa-calendar-days me-1"></i>
                        <span th:text="${#temporals.format(event.startDateTime, 'dd MMM yyyy, HH:mm')}">Date</span>
                    </p>
                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-dark btn-sm flex-fill">View</a>
                        <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-outline-primary btn-sm flex-fill"
                           sec:authorize="hasAnyRole('ADMIN', 'ORGANIZER')">Edit</a>
                        <a th:href="@{/agenda/manage/{id}(id=${event.id})}" class="btn btn-outline-secondary btn-sm flex-fill"
                           sec:authorize="hasAnyRole('ADMIN', 'ORGANIZER')">Agenda</a>
                        <form th:action="@{/events/delete/{id}(id=${event.id})}" method="post" class="d-inline"
                              sec:authorize="hasAnyRole('ADMIN', 'ORGANIZER')"
                              onsubmit="return confirm('Are you sure you want to delete this event?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
